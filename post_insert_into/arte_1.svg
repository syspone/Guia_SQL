<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121722"/><stop offset="1" stop-color="#090B10"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5"><stop offset="0" stop-color="#F2B872" stop-opacity="0.10"/><stop offset="1" stop-color="#F2B872" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/><rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="84" fill="#161B26"/><rect y="84" width="1080" height="3" fill="#F2B872"/>
  <text x="60" y="55" font-family="Adwaita Sans" font-weight="800" font-size="32" letter-spacing="8" fill="#F2B872">SYSPONE</text>
  <text x="1020" y="53" text-anchor="end" font-family="Adwaita Sans" font-size="22" letter-spacing="3" fill="#9AA3B2">GUIA SQL · AULA 02 · 1/2</text>
  <text x="540" y="205" text-anchor="middle" font-family="Fira Code" font-weight="700" font-size="96" fill="#F2B872">INSERT INTO</text>
  <text x="540" y="260" text-anchor="middle" font-family="Adwaita Sans" font-size="34" fill="#E8ECF2">o comando que dá vida à sua tabela</text>
  <rect x="90" y="300" width="900" height="360" rx="22" fill="#0D1119" stroke="#2A3242" stroke-width="2"/>
  <circle cx="126" cy="330" r="8" fill="#FF6B6B"/><circle cx="152" cy="330" r="8" fill="#F2B872"/><circle cx="178" cy="330" r="8" fill="#7BD88F"/>
  <text x="954" y="337" text-anchor="end" font-family="Fira Code" font-size="18" fill="#6B7487">02_insert_usuarios.sql</text>
  <g font-family="Fira Code" font-size="25" xml:space="preserve" fill="#C9D1DE">
    <text x="124" y="395"><tspan fill="#F2B872" font-weight="600">INSERT INTO</tspan> dbo.Usuarios (Nome, Cidade, Nasc)</text>
    <text x="124" y="433"><tspan fill="#F2B872" font-weight="600">VALUES</tspan></text>
    <text x="124" y="471">  (<tspan fill="#8FD3A6">N'Ana Souza'</tspan>,    <tspan fill="#8FD3A6">N'São Paulo'</tspan>,      <tspan fill="#8FD3A6">'1995-03-12'</tspan>),</text>
    <text x="124" y="509">  (<tspan fill="#8FD3A6">N'Bruno Lima'</tspan>,   <tspan fill="#8FD3A6">N'Rio de Janeiro'</tspan>, <tspan fill="#8FD3A6">'1988-07-25'</tspan>),</text>
    <text x="124" y="547">  (<tspan fill="#8FD3A6">N'Carla Mendes'</tspan>, <tspan fill="#8FD3A6">N'Belo Horizonte'</tspan>, <tspan fill="#8FD3A6">'2000-11-02'</tspan>);</text>
    <text x="124" y="585"><tspan fill="#6B7487" font-style="italic">  -- ... e mais 7 usuários</tspan></text>
  </g>
  <line x1="124" y1="610" x2="956" y2="610" stroke="#2A3242" stroke-width="2"/>
  <text x="124" y="643" font-family="Fira Code" font-size="22" fill="#7BD88F">✔ (10 linhas afetadas)</text>
  <rect x="90" y="695" width="280" height="300" rx="20" fill="#161B26" stroke="#F2B872" stroke-opacity="0.45" stroke-width="2"/>
  <text x="230" y="775" text-anchor="middle" font-family="Adwaita Sans" font-size="60" font-weight="800" fill="#F2B872">1974</text>
  <text x="230" y="835" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">O SQL nasceu</text>
  <text x="230" y="869" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">na IBM com o</text>
  <text x="230" y="903" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">nome SEQUEL.</text>
  <text x="230" y="955" text-anchor="middle" font-family="Adwaita Sans" font-size="20" fill="#9AA3B2">Chamberlin &amp; Boyce</text>
  <rect x="400" y="695" width="280" height="300" rx="20" fill="#161B26" stroke="#F2B872" stroke-opacity="0.45" stroke-width="2"/>
  <text x="540" y="775" text-anchor="middle" font-family="Adwaita Sans" font-size="60" font-weight="800" fill="#F2B872">1.000</text>
  <text x="540" y="835" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">linhas é o limite</text>
  <text x="540" y="869" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">de um só VALUES</text>
  <text x="540" y="903" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">no SQL Server.</text>
  <text x="540" y="955" text-anchor="middle" font-family="Adwaita Sans" font-size="20" fill="#9AA3B2">desde a versão 2008</text>
  <rect x="710" y="695" width="280" height="300" rx="20" fill="#161B26" stroke="#F2B872" stroke-opacity="0.45" stroke-width="2"/>
  <text x="850" y="775" text-anchor="middle" font-family="Adwaita Sans" font-size="56" font-weight="800" font-family="Fira Code" fill="#F2B872">N'…'</text>
  <text x="850" y="835" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">O N marca texto</text>
  <text x="850" y="869" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">Unicode e salva</text>
  <text x="850" y="903" text-anchor="middle" font-family="Adwaita Sans" font-size="25" fill="#E8ECF2">os acentos!</text>
  <text x="850" y="955" text-anchor="middle" font-family="Adwaita Sans" font-size="20" fill="#9AA3B2">“Florianópolis” ✔</text>
  <text x="540" y="1050" text-anchor="middle" font-family="Adwaita Sans" font-size="22" letter-spacing="2" fill="#6B7487">@cristian_souzaac · arraste e veja o resultado →</text>
</svg>
